apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cmapss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: cmapss-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8010
          env:
            - name: MONGO_URI
              value: "mongodb://mongodb:27017"
            - name: MONGO_DB
              value: "monitoring"
            - name: MONGO_COLLECTION
              value: "scored_readings"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cmapss
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 8010
      targetPort: 8010
      nodePort: 30810