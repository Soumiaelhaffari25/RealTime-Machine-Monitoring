kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cmapss
nodes:
  - role: control-plane
    extraPortMappings:
      # Grafana accessible depuis Windows sur localhost:3000
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
      # API accessible depuis Windows sur localhost:8010
      - containerPort: 30810
        hostPort: 8010
        protocol: TCP
      # Prometheus accessible sur localhost:9090
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
  - role: worker
  - role: worker